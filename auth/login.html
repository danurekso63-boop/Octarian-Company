<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | Octarian Company</title>
    <link rel="stylesheet" href="../bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand-lg bg-black border-bottom border-secondary"><div class="container py-2"><a class="navbar-brand text-light fw-bold fs-3" href="../index.html">Octarian Company</a><a href="../index.html" class="btn btn-sm btn-outline-light">Kembali ke toko</a></div></nav>
    <main class="container"><section class="auth-card shadow-lg p-4 p-md-5">
        <span class="badge bg-danger mb-3">Member Area</span><h1 class="h2 fw-bold">Masuk ke akun Anda</h1><p class="text-secondary">Gunakan email dan kata sandi yang terdaftar.</p>
        <div id="auth-status" class="alert" role="status" aria-live="polite" hidden></div>
        <form id="login-form" novalidate>
            <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div>
            <div class="mb-3"><label class="form-label" for="password">Kata sandi</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></div>
            <button class="btn btn-danger w-100" type="submit">Masuk</button>
        </form><p class="mt-4 mb-0 text-secondary">Belum punya akun? <a class="link-light" href="register.html">Daftar sekarang</a>.</p>
    </section></main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script>
    <script>
        (function () {
            const form = document.getElementById("login-form"), status = document.getElementById("auth-status");
            function show(message, type) { status.textContent = message; status.className = "alert alert-" + type; status.hidden = false; }
            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                if (!form.checkValidity()) { form.classList.add("was-validated"); return; }
                if (!OctarianSupabase.isConfigured()) { show("Supabase belum dikonfigurasi. Isi file auth/supabase-config.js.", "warning"); return; }
                const button = form.querySelector("button"); button.disabled = true;
                const result = await OctarianSupabase.client.auth.signInWithPassword({ email: form.email.value.trim(), password: form.password.value });
                button.disabled = false;
                if (result.error) { show("Email atau kata sandi tidak valid, atau akun belum dapat digunakan.", "danger"); return; }
                window.location.replace("profile.html");
            });
        }());
    </script>
</body>
</html>
